<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Excel Library Search</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>Excel Library — Upload & Search</h1>

    <section id="upload">
      <h2>Upload Excel files</h2>
      <form id="uploadForm">
        <input type="file" id="files" name="files" multiple accept=".xls,.xlsx" />
        <button type="submit">Upload</button>
      </form>
      <div id="uploadStatus"></div>
    </section>

    <section id="search">
      <h2>Search contents</h2>
      <input id="query" placeholder="Type search terms..." />
      <button id="btnSearch">Search</button>
      <div id="results"></div>
    </section>
  </main>

  <script src="/main.js"></script>
</body>
</html>
